# Intel GPU-enabled docker-compose configuration
# Usage: docker-compose -f docker-compose.intel-gpu.yml up -d
#
# Prerequisites:
#   - Intel GPU (iGPU or discrete)
#   - Host Intel GPU drivers installed: apt install intel-media-va-driver-non-free i965-va-driver
#   - Verify with: lspci | grep VGA && vainfo
---

services:
  face-recognition:
    image: ghcr.io/wired-engineering/sa-face-recognition:latest-openvino
    container_name: sa-face-recognition-intel
    ports:
      - "8443:443"
    volumes:
      - system_data:/app/src/python/system
      - images_data:/app/src/python/images
      - weights_data:/app/src/python/weights
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped

volumes:
  system_data:
  images_data:
  weights_data: