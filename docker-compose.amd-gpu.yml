# AMD GPU/iGPU-enabled docker-compose configuration
# Usage: docker-compose -f docker-compose.amd-gpu.yml up -d
#
# Prerequisites:
#   - AMD GPU (discrete) or AMD iGPU (Ryzen APU with integrated Radeon graphics)
#   - Host AMD GPU drivers installed: apt install mesa-va-drivers mesa-vdpau-drivers
#   - Verify with: lspci | grep VGA && vainfo
---

services:
  face-recognition:
    image: ghcr.io/wired-engineering/sa-face-recognition:latest-rocm
    container_name: sa-face-recognition-amd
    ports:
      - "8443:443"
    volumes:
      - system_data:/app/src/python/system
      - images_data:/app/src/python/images
      - weights_data:/app/src/python/weights
    devices:
      - /dev/dri
      - /dev/kfd
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

volumes:
  system_data:
  images_data:
  weights_data: