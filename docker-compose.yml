---

services:
  face-recognition:
    image: safacerecognition:latest
    container_name: sa-face-recognition
    ports:
      - "8443:443"
    volumes:
      - system_data:/app/src/python/system
      - images_data:/app/src/python/images
      - weights_data:/app/src/python/weights
    restart: unless-stopped

    # GPU acceleration is disabled by default for production stability
    # To enable GPU acceleration, use one of these specialized configurations:
    #   Intel GPU:  docker-compose -f docker-compose.intel-gpu.yml up -d
    #   AMD GPU:    docker-compose -f docker-compose.amd-gpu.yml up -d

volumes:
  system_data:
  images_data:
  weights_data: