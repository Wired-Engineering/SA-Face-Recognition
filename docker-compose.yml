---

services:
  face-recognition:
    image: ghcr.io/wired-engineering/sa-face-recognition:latest${IMAGE_SUFFIX:-}
    container_name: sa-face-recognition
    ports:
      - "8443:443"
    volumes:
      - system_data:/app/src/python/system
      - images_data:/app/src/python/images
      - weights_data:/app/src/python/weights
    restart: unless-stopped

    # GPU acceleration options:
    # CPU (default):     docker-compose up -d
    # CUDA:              IMAGE_SUFFIX=-cuda docker-compose up -d
    # OpenVINO (Intel):  IMAGE_SUFFIX=-openvino docker-compose up -d
    # ROCM (AMD):        IMAGE_SUFFIX=-rocm docker-compose up -d

volumes:
  system_data:
  images_data:
  weights_data:
