<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition - Welcome Canvas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Raleway:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family, 'Inter'), -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .welcome-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Blurred background layer */
        .welcome-container::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(20px);
            z-index: -1;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;  /* Ensure status is above canvas */
        }

        .connection-status.connected {
            background-color: rgba(81, 207, 102, 0.1);
            border: 1px solid #51cf66;
            color: #51cf66;
        }

        .connection-status.disconnected {
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.connected {
            background-color: #51cf66;
        }

        .status-dot.disconnected {
            background-color: #ff6b6b;
        }

        /* Kiosk Mode Button */
        .kiosk-btn {
            position: absolute;
            top: 60px;  /* Positioned below the connection status */
            right: 20px;  /* Aligned with connection status */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;  /* Ensure button is above canvas */
        }

        .kiosk-btn:hover {
            background: rgba(100, 100, 100, 0.15);
            border-color: rgba(100, 100, 100, 0.3);
            transform: translateX(-2px);
        }

        .kiosk-btn:active {
            transform: translateX(0);
        }

        /* Hide kiosk button when already in kiosk mode */
        .kiosk-mode .kiosk-btn {
            display: none;
        }

        #circleCanvas {
            position: absolute;
            top: 25%;             /* 👈 ADJUST TOP OFFSET % HERE (pushes canvas down) */
            left: 0;
            width: 100%;          /* 👈 ADJUST WIDTH % HERE */
            height: 75%;          /* 👈 ADJUST HEIGHT % HERE (80% = removed top 20%) */
            max-width: 100%;      /* 👈 ADJUST MAX WIDTH % HERE */
            max-height: 75%;      /* 👈 ADJUST MAX HEIGHT % HERE */
            z-index: 1;
        }


        /* Kiosk Mode Enhancements */
        .kiosk-mode {
            cursor: none;
            overflow: hidden;
        }

        .kiosk-mode body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .kiosk-mode .container {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border-radius: 0;
        }

        /* Hide cursor after inactivity in kiosk mode */
        .kiosk-mode.hide-cursor {
            cursor: none !important;
        }

        .kiosk-mode.hide-cursor * {
            cursor: none !important;
        }

        /* Fullscreen optimizations */
        @media (display-mode: fullscreen) {
            body {
                overflow: hidden;
            }
            .container {
                border-radius: 0;
            }
        }

        /* Prevent text selection in kiosk mode */
        .kiosk-mode {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .waiting-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid var(--font-color, #00243D);
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--font-color, #00243D);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        .waiting-title {
            color: var(--font-color, #00243D);
            font-size: var(--waiting-font-size, 1.8rem);
            margin: 20px 0;
            font-family: var(--font-family, 'Inter'), sans-serif;
        }

        .waiting-subtitle {
            color: var(--font-color, #00243D);
            opacity: 0.7;
            font-size: var(--subtitle-font-size, 1rem);
            font-family: var(--font-family, 'Inter'), sans-serif;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Icons */
        .icon-check {
            width: 48px;
            height: 48px;
            fill: white;
        }

        .icon-user {
            width: 60px;
            height: 60px;
            fill: var(--font-color, #00243D);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <!-- Connection Status -->
        <div id="connectionStatus" class="connection-status disconnected">
            <div class="status-dot disconnected"></div>
            <span>Offline</span>
        </div>

        <!-- Kiosk Mode Button -->
        <button id="kioskModeBtn" class="kiosk-btn" title="Enter Kiosk Mode (Fullscreen)">
            <span>🖥️</span>
            <span>Kiosk Mode</span>
        </button>

        <!-- Circle Canvas -->
        <canvas id="circleCanvas" width="1920" height="1080"></canvas>

        <!-- Waiting State Overlay -->
        <div id="waitingState" class="waiting-state">
            <div class="loader"></div>
            <h2 class="waiting-title">Welcome to Signature Aviation</h2>
            <p class="waiting-subtitle">Position yourself in front of the camera</p>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Planck.js Physics Engine -->
    <script src="https://cdn.jsdelivr.net/npm/planck@1.0.5/dist/planck.min.js"></script>


    <script>
        class Circle {
            constructor(name, title, color, canvas, circleImage, settings = {}) {
                this.name = name;
                this.title = title; // User title/department
                this.color = color;
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.settings = settings;
                this.lastSeen = Date.now();
                this.fadeOut = false;
                this.alpha = 1;
                this.fontSize = settings.fontSize || 'medium';
                this.bubbleSize = settings.bubbleSize || 'medium';
                this.circleImage = circleImage; // Store the SVG image

                // Calculate text dimensions and circle size
                this.calculateTextDimensions();
                this.calculateCircleSize();

                // Starting position - center of screen
                this.targetX = this.canvas.width / 2;
                this.targetY = this.canvas.height / 2;
                this.x = this.targetX;
                this.y = this.targetY;

                // Growth animation properties
                this.currentRadius = 0; // Start tiny
                this.growthSpeed = 2; // Pixels per frame growth
                this.isGrowing = true;

                // Physics properties (will be set when added to physics world)
                this.body = null;
                this.physicsRadius = this.radius;

                console.log(`⭕ Circle for "${name}": radius=${this.radius}px, text=${this.textWidth}x${this.textHeight}`);
            }

            calculateTextDimensions() {
                // Get base font sizes based on the fontSize setting
                const baseFontSizes = {
                    small: { name: 18, title: 14 },
                    medium: { name: 22, title: 16 },
                    large: { name: 26, title: 18 },
                    xlarge: { name: 30, title: 22 }
                };

                // Bubble size multipliers for font scaling
                const bubbleSizeMultipliers = {
                    small: 0.75,
                    medium: 1.0,
                    large: 1.3,
                    xlarge: 1.6
                };

                const baseSize = baseFontSizes[this.fontSize] || baseFontSizes.medium;
                const bubbleMultiplier = bubbleSizeMultipliers[this.bubbleSize] || 1.0;
                const fontFamily = this.settings.fontFamily || 'Inter';

                // Set font sizes with bubble size scaling
                this.nameFontSize = Math.round(baseSize.name * bubbleMultiplier);
                this.titleFontSize = Math.round(baseSize.title * bubbleMultiplier);

                // Measure actual text dimensions
                this.ctx.save();

                // Measure name width
                this.ctx.font = `bold ${this.nameFontSize}px ${fontFamily}, sans-serif`;
                const nameMetrics = this.ctx.measureText(this.name);
                this.nameWidth = nameMetrics.width;

                // Measure title width
                this.titleWidth = 0;
                if (this.title) {
                    this.ctx.font = `${this.titleFontSize}px ${fontFamily}, sans-serif`;
                    const titleMetrics = this.ctx.measureText(this.title);
                    this.titleWidth = titleMetrics.width;
                }

                // Calculate total text dimensions
                this.textWidth = Math.max(this.nameWidth, this.titleWidth);
                const lineSpacing = this.title ? 8 : 0;
                this.textHeight = this.title ?
                    (this.nameFontSize + this.titleFontSize + lineSpacing) :
                    this.nameFontSize;

                this.ctx.restore();
            }

            calculateCircleSize() {
                // Calculate the diagonal of the text box (ensures text always fits)
                const textDiagonal = Math.sqrt(this.textWidth * this.textWidth + this.textHeight * this.textHeight);

                // Bubble size multipliers for radius scaling
                const bubbleSizeMultipliers = {
                    small: 0.75,
                    medium: 1.0,
                    large: 1.3,
                    xlarge: 1.6
                };
                const bubbleMultiplier = bubbleSizeMultipliers[this.bubbleSize] || 1.0;

                // Base padding that scales with font size (NOT bubble size - we'll scale everything at the end)
                const paddingScale = {
                    small: 25,
                    medium: 30,
                    large: 35,
                    xlarge: 40
                };
                const padding = paddingScale[this.fontSize] || 30;

                // Calculate radius to ensure text always fits with padding
                // Using diagonal/2 ensures even rotated text would fit
                const baseRadius = (textDiagonal / 2) + padding;

                // Set minimum and maximum radius bounds (NOT scaled - we'll scale the final radius)
                const minRadius = 40; // Minimum circle size
                const maxRadius = 150; // Maximum circle size to prevent huge bubbles

                // Apply bounds
                let radius = Math.max(minRadius, Math.min(maxRadius, baseRadius));

                // Apply bubble size multiplier to the final radius
                radius = Math.round(radius * bubbleMultiplier);

                // Add some randomness for variety (±5% only to maintain proportions)
                const randomFactor = 0.95 + Math.random() * 0.1; // 0.95 to 1.05
                this.radius = Math.round(radius * randomFactor);

                // Store a safe text area for fitting (also scaled by bubble size)
                this.safeTextRadius = this.radius - Math.round(padding * bubbleMultiplier);
            }

            update() {
                // Handle growth animation
                if (this.isGrowing && this.currentRadius < this.radius) {
                    this.currentRadius += this.growthSpeed;
                    if (this.currentRadius >= this.radius) {
                        this.currentRadius = this.radius;
                        this.isGrowing = false;
                    }
                }

                // Handle fadeout
                if (this.fadeOut) {
                    this.alpha -= 0.025; // Slightly faster fade out
                    if (this.alpha <= 0.01) { // Changed threshold to ensure complete removal
                        this.alpha = 0; // Ensure it's completely transparent
                        return false; // Mark for removal
                    }
                }

                return true; // Continue existing
            }

            draw() {
                if (this.currentRadius <= 0) return; // Don't draw if not grown yet
                if (this.alpha <= 0.01) return; // Don't draw if completely faded

                this.ctx.save();
                this.ctx.globalAlpha = this.alpha;

                // Draw the glowing circle SVG image
                if (this.circleImage && this.circleImage.complete) {
                    // Calculate the size for the SVG based on current radius
                    const size = this.currentRadius * 2;

                    // Create temporary canvas to apply color tinting to SVG
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = size;
                    tempCanvas.height = size;
                    const tempCtx = tempCanvas.getContext('2d');

                    // Draw the SVG to temporary canvas
                    tempCtx.drawImage(this.circleImage, 0, 0, size, size);

                    // Apply color tinting using composite operation
                    tempCtx.globalCompositeOperation = 'source-in';
                    tempCtx.fillStyle = this.color || '#4ECDC4';
                    tempCtx.fillRect(0, 0, size, size);

                    // Draw the tinted circle to main canvas
                    this.ctx.drawImage(tempCanvas,
                        this.x - this.currentRadius,
                        this.y - this.currentRadius,
                        size,
                        size
                    );
                } else {
                    // Fallback to simple circle if image not loaded
                    this.ctx.beginPath();
                    this.ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                    this.ctx.strokeStyle = this.color || '#4ECDC4';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                }

                // Draw text if circle is large enough
                if (this.currentRadius > 20) {
                    this.drawText();
                }

                this.ctx.restore();
            }

            drawText() {
                this.ctx.save();
                this.ctx.globalAlpha = this.alpha;
                this.ctx.textAlign = 'center';

                // Get font settings
                const fontFamily = this.settings.fontFamily || 'Inter';
                const fontColor = this.settings.fontColor || '#00243D';

                // Add text shadow for better readability
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                this.ctx.shadowBlur = 2;
                this.ctx.shadowOffsetX = 1;
                this.ctx.shadowOffsetY = 1;

                // Calculate growth scale factor based on current radius vs target radius
                const growthScale = this.currentRadius / this.radius;

                // Scale font sizes with the bubble growth
                let nameFontSize = this.nameFontSize * growthScale;
                let titleFontSize = this.titleFontSize * growthScale;

                // Use the safe text radius to ensure text fits (scaled with current size)
                const currentSafeTextRadius = this.safeTextRadius * growthScale;
                if (currentSafeTextRadius) {
                    const maxTextWidth = currentSafeTextRadius * 1.8; // Allow text to use most of the circle width

                    // Scale down if text is too wide (based on scaled text dimensions)
                    const scaledTextWidth = this.textWidth * growthScale;
                    if (scaledTextWidth > maxTextWidth) {
                        const scale = maxTextWidth / scaledTextWidth;
                        nameFontSize = Math.floor(nameFontSize * scale);
                        titleFontSize = Math.floor(titleFontSize * scale);
                    }
                }

                if (this.title) {
                    // Draw both name and title
                    // Calculate vertical centering with potentially scaled fonts
                    const lineSpacing = 6 * growthScale; // Scale line spacing too
                    const totalTextHeight = nameFontSize + titleFontSize + lineSpacing;
                    const startY = this.y - (totalTextHeight / 2);

                    // Draw name (larger, bold)
                    this.ctx.fillStyle = fontColor;
                    this.ctx.font = `bold ${nameFontSize}px ${fontFamily}, sans-serif`;
                    this.ctx.textBaseline = 'top';
                    this.ctx.fillText(this.name, this.x, startY);

                    // Draw title (smaller, regular)
                    this.ctx.fillStyle = fontColor;
                    this.ctx.globalAlpha = this.alpha * 0.85; // Slightly more transparent
                    this.ctx.font = `${titleFontSize}px ${fontFamily}, sans-serif`;
                    this.ctx.fillText(this.title, this.x, startY + nameFontSize + lineSpacing);
                } else {
                    // Draw only name (centered)
                    this.ctx.fillStyle = fontColor;
                    this.ctx.font = `bold ${nameFontSize}px ${fontFamily}, sans-serif`;
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(this.name, this.x, this.y);
                }

                this.ctx.restore();
            }

            startFadeOut() {
                this.fadeOut = true;
            }

            // Set physics position (called by physics engine)
            setPhysicsPosition(x, y) {
                this.x = x;
                this.y = y;
            }
        }

        class WelcomeScreenPopup {
            constructor() {
                this.socket = null;
                this.isConnected = false;
                this.circles = new Map(); // Map of person_id to Circle
                this.recognitionQueue = new Map(); // Map of person_id to recognition data with timestamps
                this.queueProcessInterval = null;
                this.apiBase = this.detectApiBase();
                this.settings = {
                    backgroundColor: '#E1EBFF',
                    fontColor: '#00243D',
                    circleColor: '#4ECDC4', // Renamed from cloudColor
                    timer: 5,
                    useBackgroundImage: false,
                    backgroundImage: null,
                    fontFamily: 'Inter',
                    fontSize: 'medium',
                    bubbleSize: 'medium'
                };
                this.isPersistent = false;
                this.isKioskMode = false;

                // Canvas setup
                this.canvas = document.getElementById('circleCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.animationFrame = null;

                // Physics world setup
                this.world = null;
                this.physicsScale = 50; // Pixels per meter for physics simulation

                // Glowing circle SVG image
                this.circleImage = null;
                this.circleImageLoaded = false;

                // Load settings asynchronously and then apply them
                this.loadSettings().then(() => {
                    this.applySettings();
                    this.setupCanvas();
                    this.setupPhysics();
                    this.loadCircleImage().then(() => {
                        this.startAnimation();
                        console.log('✅ Settings loaded, circle SVG loaded, and physics engine ready');
                    });
                });
                this.setupKioskMode();
                this.connectSocketIO();
                this.setupMessageListener();
                this.startQueueProcessor();

                // Close window on escape key (only if not persistent)
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.isPersistent) {
                        window.close();
                    }
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    this.setupCanvas();
                    this.recreatePhysicsWorld();
                });
            }

            setupCanvas() {
                // Set canvas size to its actual rendered size (respects CSS constraints)
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                console.log(`📐 Canvas sized to: ${rect.width}x${rect.height}px`);
            }

            setupPhysics() {
                // Create physics world with zero gravity (circles should float, not fall)
                this.world = planck.World({
                    gravity: planck.Vec2(0, 0) // No gravity
                });

                this.createPhysicsWalls();
                console.log(`🏗️ Physics world created: ${(this.canvas.width / this.physicsScale).toFixed(1)}x${(this.canvas.height / this.physicsScale).toFixed(1)} units`);
            }

            createPhysicsWalls() {
                if (!this.world) return;

                // Create invisible walls around the screen to contain circles
                const wallThickness = 0.5; // Thickness in physics units
                const worldWidth = this.canvas.width / this.physicsScale;
                const worldHeight = this.canvas.height / this.physicsScale;

                // Top wall
                this.world.createBody({
                    position: planck.Vec2(worldWidth / 2, -wallThickness / 2)
                }).createFixture(planck.Box(worldWidth / 2, wallThickness / 2));

                // Bottom wall
                this.world.createBody({
                    position: planck.Vec2(worldWidth / 2, worldHeight + wallThickness / 2)
                }).createFixture(planck.Box(worldWidth / 2, wallThickness / 2));

                // Left wall
                this.world.createBody({
                    position: planck.Vec2(-wallThickness / 2, worldHeight / 2)
                }).createFixture(planck.Box(wallThickness / 2, worldHeight / 2));

                // Right wall
                this.world.createBody({
                    position: planck.Vec2(worldWidth + wallThickness / 2, worldHeight / 2)
                }).createFixture(planck.Box(wallThickness / 2, worldHeight / 2));
            }

            recreatePhysicsWorld() {
                if (!this.world) {
                    this.setupPhysics();
                    return;
                }

                // Store existing circles and their velocities
                const existingCircles = new Map();
                for (const [personId, circle] of this.circles) {
                    if (circle.body) {
                        existingCircles.set(personId, {
                            circle: circle,
                            velocity: circle.body.getLinearVelocity(),
                            position: circle.body.getPosition()
                        });
                    }
                }

                // Create new world with updated boundaries
                this.world = planck.World({
                    gravity: planck.Vec2(0, 0)
                });
                this.createPhysicsWalls();

                // Recreate physics bodies for existing circles
                for (const [personId, data] of existingCircles) {
                    const circle = data.circle;

                    // Adjust position to fit new boundaries
                    const worldWidth = this.canvas.width / this.physicsScale;
                    const worldHeight = this.canvas.height / this.physicsScale;
                    let newX = Math.min(Math.max(data.position.x, 1), worldWidth - 1);
                    let newY = Math.min(Math.max(data.position.y, 1), worldHeight - 1);

                    // Create new body
                    circle.body = this.world.createBody({
                        type: 'dynamic',
                        position: planck.Vec2(newX, newY),
                        linearDamping: 0.5,
                        angularDamping: 0.8,
                        bullet: true
                    });

                    const radius = circle.radius / this.physicsScale;
                    circle.body.createFixture(planck.Circle(radius), {
                        density: 0.5,
                        friction: 0.1,
                        restitution: 0.8
                    });

                    // Restore velocity
                    circle.body.setLinearVelocity(data.velocity);
                    circle.body.circle = circle;
                }

                console.log(`🔄 Physics world recreated for new size: ${this.canvas.width}x${this.canvas.height}`);
            }

            startQueueProcessor() {
                // Process the recognition queue every 500ms
                this.queueProcessInterval = setInterval(() => {
                    this.processRecognitionQueue();
                }, 500);
            }

            processRecognitionQueue() {
                const now = Date.now();
                // Use timer from settings (convert seconds to milliseconds)
                const queueTimeout = (this.settings.timer || 5) * 1000;
                const displayDelay = 1000; // 1 second delay before showing circle (to accumulate multiple people)

                // Clean up people who have left the frame
                for (const [personId, queueData] of this.recognitionQueue) {
                    if (now - queueData.lastSeen > queueTimeout) {
                        this.recognitionQueue.delete(personId);
                        if (this.circles.has(personId)) {
                            this.removeCircle(personId);
                        }
                    }
                }

                // Process all people in queue: create new circles or refresh existing ones
                for (const [personId, queueData] of this.recognitionQueue) {
                    if (!this.circles.has(personId)) {
                        // Create new circle if person has been in queue long enough
                        if (now - queueData.firstSeen > displayDelay) {
                            this.addCircle(queueData.user);
                        }
                    } else {
                        // Refresh existing circle
                        this.addCircle(queueData.user);
                    }
                }
            }

            addToRecognitionQueue(user) {
                const personId = user.person_id || user.personId;
                const name = user.name || user.person_name;
                const now = Date.now();

                // Filter out unknown faces - don't add them to the queue
                if (!personId || !name ||
                    name.toLowerCase() === 'unknown' ||
                    name.toLowerCase() === 'unrecognized' ||
                    personId === 'unknown' ||
                    personId === -1 ||
                    personId === '-1') {
                    console.log(`⚠️ Skipping unknown/unrecognized face: ${name || 'no name'} (ID: ${personId})`);
                    return;
                }

                if (this.recognitionQueue.has(personId)) {
                    // Update existing queue entry
                    const queueData = this.recognitionQueue.get(personId);
                    queueData.lastSeen = now;
                    queueData.user = user;
                } else {
                    // Add new queue entry
                    this.recognitionQueue.set(personId, {
                        user: user,
                        firstSeen: now,
                        lastSeen: now
                    });
                }
            }

            async loadCircleImage() {

                return new Promise((resolve, reject) => {
                    this.circleImage = new Image();
                    this.circleImage.onload = () => {

                    this.circleImage.onerror = (error) => {
                        console.warn('⚠️ Failed to load glowing circle SVG, falling back to simple circles:', error);
                        this.circleImageLoaded = false;
                        resolve(); // Continue anyway with fallback
                    };

                    this.circleImage.src = 'Glowing Circle.svg';

            startAnimation() {
                const animate = () => {
                    this.updatePhysics();
                    this.updateCircles();
                    this.drawCircles();
                    this.animationFrame = requestAnimationFrame(animate);
                };
                animate();
            }

            updatePhysics() {
                // Step the physics world forward
                if (this.world) {
                    const timeStep = 1 / 60; // 60 FPS
                    const velocityIterations = 8; // More iterations for better collision resolution
                    const positionIterations = 3;
                    this.world.step(timeStep, velocityIterations, positionIterations);

                    // Apply subtle random forces for ambient movement and jiggliness
                    for (const [personId, circle] of this.circles) {
                        if (circle.body && !circle.fadeOut) {
                            const velocity = circle.body.getLinearVelocity();
                            const currentSpeed = velocity.length();

                            // Keep minimum speed to ensure continuous movement
                            const minSpeed = 1.5; // Minimum speed for constant motion
                            if (currentSpeed < minSpeed) {
                                // Add force to maintain minimum movement
                                const angle = Math.atan2(velocity.y, velocity.x) || Math.random() * Math.PI * 2;
                                const boostForce = 3;
                                circle.body.applyForceToCenter(planck.Vec2(
                                    Math.cos(angle) * boostForce,
                                    Math.sin(angle) * boostForce
                                ));
                            }

                            // Add small random forces for ambient jiggling
                            if (Math.random() < 0.15) { // 15% chance per frame for more activity
                                const jiggleForce = 2.5;
                                const fx = (Math.random() - 0.5) * jiggleForce;
                                const fy = (Math.random() - 0.5) * jiggleForce;
                                circle.body.applyForceToCenter(planck.Vec2(fx, fy));
                            }

                            // Apply gentle repulsion from edges to keep circles more centered
                            const pos = circle.body.getPosition();
                            const worldWidth = this.canvas.width / this.physicsScale;
                            const worldHeight = this.canvas.height / this.physicsScale;
                            const edgeDistance = 3; // Distance from edge to start repulsion
                            const repulsionForce = 1;

                            if (pos.x < edgeDistance) {
                                circle.body.applyForceToCenter(planck.Vec2(repulsionForce, 0));
                            } else if (pos.x > worldWidth - edgeDistance) {
                                circle.body.applyForceToCenter(planck.Vec2(-repulsionForce, 0));
                            }

                            if (pos.y < edgeDistance) {
                                circle.body.applyForceToCenter(planck.Vec2(0, repulsionForce));
                            } else if (pos.y > worldHeight - edgeDistance) {
                                circle.body.applyForceToCenter(planck.Vec2(0, -repulsionForce));
                            }

                            // Limit maximum velocity to prevent circles from going too fast
                            const currentVelocity = circle.body.getLinearVelocity();
                            const maxSpeed = 8;
                            const speed = currentVelocity.length();
                            if (speed > maxSpeed) {
                                const scale = maxSpeed / speed;
                                circle.body.setLinearVelocity(planck.Vec2(
                                    currentVelocity.x * scale,
                                    currentVelocity.y * scale
                                ));
                            }

                            // Update circle position from physics body
                            circle.setPhysicsPosition(
                                pos.x * this.physicsScale,
                                pos.y * this.physicsScale
                            );
                        }
                    }
                }
            }

            updateCircles() {
                const circlesToRemove = [];

                // Update each circle
                for (const [personId, circle] of this.circles) {
                    if (!circle.update()) {
                        circlesToRemove.push(personId);
                        continue;
                    }

                    // Check for timeouts - only timeout if person is not in the recognition queue
                    if (!circle.fadeOut && !this.recognitionQueue.has(personId)) {
                        circle.startFadeOut();
                    }
                }

                // Remove faded out circles and their physics bodies
                for (const personId of circlesToRemove) {
                    const circle = this.circles.get(personId);
                    if (circle && circle.body) {
                        this.world.destroyBody(circle.body);
                    }
                    this.circles.delete(personId);
                }
            }

            // Physics handles positioning automatically

            drawCircles() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw all circles
                for (const circle of this.circles.values()) {
                    circle.draw();
                }

                // Show waiting state if no circles
                if (this.circles.size === 0) {
                    document.getElementById('waitingState').classList.remove('hidden');
                } else {
                    document.getElementById('waitingState').classList.add('hidden');
                }
            }

            addCircle(user) {
                const personId = user.person_id || user.personId;
                const name = user.name || user.person_name || 'Unknown';
                const title = user.userTitle || user.title || null;

                // Double-check: Don't create circles for unknown faces
                if (!personId ||
                    name.toLowerCase() === 'unknown' ||
                    name.toLowerCase() === 'unrecognized' ||
                    personId === 'unknown' ||
                    personId === -1 ||
                    personId === '-1') {
                    console.log(`⚠️ Preventing circle creation for unknown face: ${name}`);
                    return;
                }

                if (this.circles.has(personId)) {
                    // Update existing circle - refresh its timer
                    const circle = this.circles.get(personId);
                    circle.lastSeen = Date.now();
                    circle.fadeOut = false;
                    circle.alpha = 1;
                } else {
                    // Create new circle for new person
                    const color = this.settings.circleColor;
                    const circle = new Circle(name, title, color, this.canvas, this.circleImage, this.settings);

                    // Add physics body for the circle
                    this.addPhysicsBody(circle);

                    this.circles.set(personId, circle);
                    console.log(`⭕ Added circle for "${name}" (ID: ${personId})`);
                }
            }

            addPhysicsBody(circle) {
                if (!this.world) return;

                // Random starting position from center of screen
                const centerX = (this.canvas.width / 2) / this.physicsScale;
                const centerY = (this.canvas.height / 2) / this.physicsScale;

                // Add some randomness to spawn position
                const offsetRange = 1; // Smaller offset for closer spawning
                const startX = centerX + (Math.random() - 0.5) * offsetRange;
                const startY = centerY + (Math.random() - 0.5) * offsetRange;

                // Create physics body
                circle.body = this.world.createBody({
                    type: 'dynamic',
                    position: planck.Vec2(startX, startY),
                    linearDamping: 0.5, // Some damping but not too much
                    angularDamping: 0.8, // Higher angular damping to prevent excessive spinning
                    bullet: true // Better collision detection for fast moving objects
                });

                // Create circular fixture
                const radius = circle.radius / this.physicsScale;
                circle.body.createFixture(planck.Circle(radius), {
                    density: 0.5, // Lighter density for more floaty movement
                    friction: 0.1, // Low friction for smoother sliding
                    restitution: 0.8 // Higher restitution for more bounciness!
                });

                // Give it a random initial velocity for fun movement
                const initialSpeed = 3 + Math.random() * 3; // Random speed between 3-6
                const angle = Math.random() * Math.PI * 2;
                circle.body.setLinearVelocity(planck.Vec2(
                    Math.cos(angle) * initialSpeed,
                    Math.sin(angle) * initialSpeed
                ));

                // Add a small random spin for extra jiggliness
                const spinSpeed = (Math.random() - 0.5) * 2;
                circle.body.setAngularVelocity(spinSpeed);

                // Store reference for interactive forces
                circle.body.circle = circle;
            }

            removeCircle(personId) {
                if (this.circles.has(personId)) {
                    const circle = this.circles.get(personId);
                    circle.startFadeOut();
                }
            }

            // Dynamically detect API base URL for deployment flexibility
            detectApiBase() {
                const urlParams = new URLSearchParams(window.location.search);

                // First priority: explicit apiBase parameter passed from opener
                if (urlParams.has('apiBase')) {
                    const apiBase = urlParams.get('apiBase');
                    console.log('🌐 Using explicit API base from URL params:', apiBase);
                    return apiBase;
                }

                // Second priority: derive from current window location
                const origin = window.location.origin;
                // In development, use FastAPI backend directly
                // In production (Docker), use current origin (nginx proxy)
                const isDevelopment = window.location.port === '5173';
                const apiBase = isDevelopment ? 'http://localhost:8000' : origin;
                console.log('🌐 Using API base:', apiBase, '(development:', isDevelopment, ')');
                return apiBase;
            }

            async loadSettings() {
                // Try to get settings from URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('backgroundColor')) {
                    this.settings.backgroundColor = urlParams.get('backgroundColor');
                }
                if (urlParams.has('fontColor')) {
                    this.settings.fontColor = urlParams.get('fontColor');
                }
                if (urlParams.has('circleColor') || urlParams.has('cloudColor')) {
                    this.settings.circleColor = urlParams.get('circleColor') || urlParams.get('cloudColor');
                }
                if (urlParams.has('timer')) {
                    this.settings.timer = parseInt(urlParams.get('timer')) || 5;
                }
                if (urlParams.has('persistent')) {
                    this.isPersistent = urlParams.get('persistent') === 'true';
                }
                if (urlParams.has('kiosk')) {
                    this.isKioskMode = urlParams.get('kiosk') === 'true';
                    console.log('🖥️ Kiosk mode:', this.isKioskMode);
                }
                if (urlParams.has('useBackgroundImage')) {
                    this.settings.useBackgroundImage = urlParams.get('useBackgroundImage') === 'true';
                }
                // Background image will be sent via postMessage to avoid URL length limits
                if (urlParams.has('fontFamily')) {
                    this.settings.fontFamily = urlParams.get('fontFamily');
                }
                if (urlParams.has('fontSize')) {
                    this.settings.fontSize = urlParams.get('fontSize');
                }
                if (urlParams.has('bubbleSize')) {
                    this.settings.bubbleSize = urlParams.get('bubbleSize');
                }

                // Fetch latest settings from the backend API
                try {
                    const apiUrl = this.apiBase + '/api/display/settings';
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            console.log('📋 Loaded display settings from API:', data);
                            // Update settings with backend values
                            this.settings.backgroundColor = data.background_color || this.settings.backgroundColor;
                            this.settings.fontColor = data.font_color || this.settings.fontColor;
                            this.settings.circleColor = data.cloud_color || data.circle_color || this.settings.circleColor; // Support both names
                            this.settings.timer = data.timer || this.settings.timer;
                            this.settings.useBackgroundImage = data.use_background_image || false;
                            this.settings.fontFamily = data.font_family || this.settings.fontFamily;
                            this.settings.fontSize = data.font_size || this.settings.fontSize;
                            this.settings.bubbleSize = data.bubble_size || this.settings.bubbleSize;

                            // If background image is enabled and exists on server, fetch it
                            if (data.use_background_image && data.has_background_image) {
                                // Add cache buster to ensure fresh image
                                const cacheBuster = Date.now();
                                this.settings.backgroundImage = `${this.apiBase}/api/display/background-image?t=${cacheBuster}`;
                                console.log('🖼️ Background image URL:', this.settings.backgroundImage);
                            }
                        }
                    }
                } catch (error) {
                    console.warn('Failed to fetch display settings from API:', error);
                    // Fall back to localStorage if API fails
                    const savedSettings = localStorage.getItem('faceRecognitionDisplaySettings');
                    if (savedSettings) {
                        try {
                            const parsed = JSON.parse(savedSettings);
                            this.settings = { ...this.settings, ...parsed };
                        } catch (e) {
                            console.warn('Failed to parse saved settings:', e);
                        }
                    }
                }
            }

            setupMessageListener() {
                // Listen for messages from parent window
                window.addEventListener('message', (event) => {
                    if (event.origin !== window.location.origin) return;

                    if (event.data.type === 'settings_update') {
                        // Check if bubble size or font size changed (requires circle recreation)
                        const newSettings = event.data.settings;
                        const bubbleSizeChanged = newSettings.bubbleSize && newSettings.bubbleSize !== this.settings.bubbleSize;
                        const fontSizeChanged = newSettings.fontSize && newSettings.fontSize !== this.settings.fontSize;

                        this.settings = { ...this.settings, ...newSettings };
                        this.applySettings();
                        console.log('📝 Settings updated from parent window');

                        // If bubble or font size changed, clear existing circles so they get recreated with new sizes
                        if (bubbleSizeChanged || fontSizeChanged) {
                            console.log('🔄 Bubble/font size changed - clearing circles for recreation');
                            for (const [personId, circle] of this.circles) {
                                if (circle.body) {
                                    this.world.destroyBody(circle.body);
                                }
                            }
                            this.circles.clear();
                        }
                    } else if (event.data.type === 'enable_kiosk_mode') {
                        this.enableKioskMode();
                        console.log('🖥️ Kiosk mode enabled from parent window');
                    }
                });
            }

            setupKioskMode() {
                // Check if kiosk mode should be enabled
                if (this.isKioskMode) {
                    console.log('🖥️ Initializing kiosk mode from URL parameter');
                    this.setupKioskModeEnhancements();
                } else if (this.shouldAutoEnableKioskMode()) {
                    console.log('🖥️ Auto-enabling kiosk mode for direct access');
                    this.isKioskMode = true;
                    this.setupKioskModeEnhancements();
                }
            }

            shouldAutoEnableKioskMode() {
                const urlParams = new URLSearchParams(window.location.search);

                // If opened directly without specific parameters, enable kiosk mode
                // Check if it has no styling parameters OR only has apiBase parameter
                const stylingParams = ['backgroundColor', 'fontColor', 'circleColor', 'cloudColor', 'timer', 'persistent', 'kiosk', 'fontFamily', 'fontSize'];
                const hasStylingParams = stylingParams.some(param => urlParams.has(param));

                // Only has apiBase or no parameters at all - this indicates direct access
                const onlyHasApiBase = !hasStylingParams && (urlParams.has('apiBase') || urlParams.toString() === '');

                return onlyHasApiBase;
            }

            setupCursorHiding() {
                let cursorTimer;
                const hideCursorDelay = 3000; // Hide cursor after 3 seconds of inactivity

                const showCursor = () => {
                    document.body.classList.remove('hide-cursor');
                    clearTimeout(cursorTimer);
                    cursorTimer = setTimeout(() => {
                        document.body.classList.add('hide-cursor');
                    }, hideCursorDelay);
                };

                // Show cursor on mouse movement
                document.addEventListener('mousemove', showCursor);
                document.addEventListener('mousedown', showCursor);

                // Start the timer
                showCursor();
            }

            attemptFullscreen() {
                // Skip fullscreen instructions when auto-enabled (direct access)
                const wasAutoEnabled = this.shouldAutoEnableKioskMode();

                try {
                    const element = document.documentElement;
                    if (element.requestFullscreen) {
                        element.requestFullscreen();
                    } else if (element.webkitRequestFullscreen) {
                        element.webkitRequestFullscreen();
                    } else if (element.msRequestFullscreen) {
                        element.msRequestFullscreen();
                    } else if (element.mozRequestFullScreen) {
                        element.mozRequestFullScreen();
                    }
                    console.log('📺 Attempted to enter fullscreen mode');

                    // Only show instructions if manually triggered (not auto-enabled)
                    if (!wasAutoEnabled) {
                        setTimeout(() => {
                            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                                this.showFullscreenInstructions();
                            }
                        }, 1000);
                    }
                } catch (error) {
                    console.log('ℹ️ Fullscreen API not available:', error.message);
                    // Only show instructions if manually triggered (not auto-enabled)
                    if (!wasAutoEnabled) {
                        this.showFullscreenInstructions();
                    }
                }
            }

            connectSocketIO() {
                try {
                    // Use dynamic API base for Socket.IO
                    const socketUrl = this.apiBase;
                    console.log('🔌 Connecting to Socket.IO at:', socketUrl);
                    this.socket = io(socketUrl, {
                        transports: ['polling', 'websocket'],
                        forceNew: true,
                        timeout: 20000
                    });

                    this.socket.on('connect', () => {
                        console.log('✅ Connected to SocketIO server');
                        this.updateConnectionStatus(true);

                        // Register this popup as a Welcome Canvas
                        this.socket.emit('register_welcome_screen', {});
                    });

                    this.socket.on('disconnect', () => {
                        console.log('❌ SocketIO connection closed');
                        this.updateConnectionStatus(false);
                    });

                    this.socket.on('recognition_result', (data) => {
                        if (data.type === 'batch_recognition' && data.users && Array.isArray(data.users)) {
                            for (const user of data.users) {
                                this.addToRecognitionQueue(user);
                            }
                        } else if (data.type === 'recognition' && data.user) {
                            this.addToRecognitionQueue(data.user);
                        }
                    });

                    // Handle keep-alive messages to extend display duration
                    this.socket.on('recognition_keep_alive', (data) => {
                        if (data.person_name && this.recognitionQueue.has(data.person_name)) {
                            // Update the timestamp to extend display time
                            const queueData = this.recognitionQueue.get(data.person_name);
                            queueData.timestamp = Date.now();
                            this.recognitionQueue.set(data.person_name, queueData);
                            console.log(`🔄 Keep-alive for ${data.person_name} - extending display time`);
                        }
                    });

                    this.socket.on('welcome_screen_registered', (data) => {
                        console.log('📺 Welcome Canvas registered successfully:', data);

                        // Request background image settings if needed
                        if (this.settings.useBackgroundImage && !this.settings.backgroundImage) {
                            this.socket.emit('request_background_image', {});
                        }

                        // Check detection status after registration
                        this.checkDetectionStatus();
                    });

                    this.socket.on('background_image_data', (data) => {
                        console.log('🖼️ Received background image data');
                        if (data.backgroundImage) {
                            this.settings.backgroundImage = data.backgroundImage;
                            this.settings.useBackgroundImage = data.useBackgroundImage;
                        } else {
                            // Background image was deleted
                            this.settings.backgroundImage = null;
                            this.settings.useBackgroundImage = false;
                        }
                        this.applySettings();
                    });

                    this.socket.on('display_settings_updated', (settings) => {
                        console.log('📋 Received updated display settings:', settings);

                        // Check if bubble size or font size changed (requires circle recreation)
                        const bubbleSizeChanged = settings.bubble_size && settings.bubble_size !== this.settings.bubbleSize;
                        const fontSizeChanged = settings.font_size && settings.font_size !== this.settings.fontSize;

                        // Update current settings with new values
                        this.settings = { ...this.settings, ...settings };
                        this.applySettings();

                        // If bubble or font size changed, clear existing circles so they get recreated with new sizes
                        if (bubbleSizeChanged || fontSizeChanged) {
                            console.log('🔄 Bubble/font size changed - clearing circles for recreation');
                            for (const [personId, circle] of this.circles) {
                                if (circle.body) {
                                    this.world.destroyBody(circle.body);
                                }
                            }
                            this.circles.clear();
                        }
                    });

                    this.socket.on('connect_error', (error) => {
                        console.error('SocketIO connection error:', error);
                        this.updateConnectionStatus(false);
                    });

                } catch (error) {
                    console.error('Failed to connect to SocketIO:', error);
                    this.updateConnectionStatus(false);
                }
            }

            // Removed polling - Welcome popup should only use WebSocket events for real-time recognition

                const statusEl = document.getElementById('connectionStatus');

                if (connected) {

                    dotEl.className = 'status-dot connected';
                    textEl.textContent = 'Live';
                } else {
                    statusEl.className = 'connection-status disconnected';
                    dotEl.className = 'status-dot disconnected';
                    textEl.textContent = 'Offline';
                }
            }

            closeWindow() {
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
                if (this.queueProcessInterval) {
                    clearInterval(this.queueProcessInterval);
                }
                if (this.socket) {
                    this.socket.emit('unregister_welcome_screen', {});
                    this.socket.disconnect();
                }

                // Small delay before closing to show the final state
                setTimeout(() => {
                    window.close();
                }, 500);
            }

            // Toggle kiosk mode (called from button)
            toggleKioskMode() {
                if (!this.isKioskMode) {
                    this.enableKioskMode();
                } else {
                    console.log('ℹ️ Already in kiosk mode');
                }
            }

            // Enable kiosk mode dynamically
            enableKioskMode() {
                if (this.isKioskMode) {
                    console.log('ℹ️ Kiosk mode already enabled');
                    return;
                }

                console.log('🖥️ Enabling kiosk mode dynamically');
                this.isKioskMode = true;

                // Apply kiosk mode enhancements
                this.setupKioskModeEnhancements();
            }

            // Apply kiosk mode enhancements (separated from setupKioskMode for dynamic use)
            setupKioskModeEnhancements() {
                // Apply kiosk CSS class
                document.documentElement.classList.add('kiosk-mode');
                document.body.classList.add('kiosk-mode');

                // Setup cursor hiding after inactivity
                this.setupCursorHiding();

                // Try to enter fullscreen
                this.attemptFullscreen();

                // Disable context menu
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });

                // Disable text selection
                document.addEventListener('selectstart', (e) => {
                    e.preventDefault();
                    return false;
                });

                // Disable drag and drop
                document.addEventListener('dragstart', (e) => {
                    e.preventDefault();
                    return false;
                });

                // Prevent zoom with keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) {
                        e.preventDefault();
                        return false;
                    }
                });

                console.log('✅ Kiosk mode enhancements applied dynamically');
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.welcomePopup = new WelcomeScreenPopup();

            // Setup kiosk mode button click handler
            const kioskBtn = document.getElementById('kioskModeBtn');
            if (kioskBtn) {
                kioskBtn.addEventListener('click', () => {
                    if (window.welcomePopup) {
                        window.welcomePopup.toggleKioskMode();
                    }
                });
            }
        });
    </script>
</body>
</html>
